name: CI
run-name: CI quickie by @${{ github.actor }}

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
      # shellcheck comes with the ubuntu-latest runner
      # and with aljazmc/actions-debian for self-hosted
      # testing with act
      - run: shellcheck --version
      - run: shellcheck */project.sh tests/*.sh

  test-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
      - run: |
          for test in tests/test_*.sh; do bash "$test"; done

